name: Run tests

on:
  push:
    branches: [ "main", "develop", "release/**", "hotfix/**" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }} deps)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ "8.1", "8.2", "8.3", "8.4", "8.5" ]
        dependencies: [ "highest" ]
        include:
          - php: "8.1"
            dependencies: "lowest"

    steps:
    - uses: actions/checkout@v5

    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: intl
        coverage: none

    - name: Validate composer.json
      run: composer validate --strict

    # composer.lock is not versioned: dependencies are resolved on every run
    - uses: ramsey/composer-install@v4
      with:
        dependency-versions: ${{ matrix.dependencies }}

    - name: Run test suite
      run: ./vendor/bin/phpunit --no-coverage

  static-analysis:
    name: Static analysis and code style
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - uses: shivammathur/setup-php@v2
      with:
        php-version: "8.1"
        extensions: intl
        coverage: none

    - uses: ramsey/composer-install@v4

    - name: PHPStan
      run: ./vendor/bin/phpstan analyse --no-progress

    - name: PHP CS Fixer
      run: ./vendor/bin/php-cs-fixer fix --dry-run --diff --show-progress=none

    - name: Rector
      run: ./vendor/bin/rector process --dry-run --no-progress-bar
